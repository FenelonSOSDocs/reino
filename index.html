<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="theme-color" content="#141019">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Reino das Relíquias</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>(function(){var w=Math.min(screen.width,screen.height);if(w>430){document.querySelector("meta[name=viewport]").setAttribute("content","width=430,viewport-fit=cover")}})()</script>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#141019;--fundo:#1b1626;--card:#2a2236;--card2:#33293f;--bd:#4a3a52;--bd2:#6a5470;--tx:#f4e9d8;--mu:#bba99a;--au:#e8b04a;--ok:#7fc46a;--rui:#e06a5a;--etapa:#d0723c;--etapa2:#8e4420}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font-family:Nunito,system-ui,sans-serif;font-weight:700;min-height:100vh}
h1,h2,h3,.h3,header.topo .gnome b,.premios div b{font-family:"Pixelify Sans",ui-monospace,monospace;font-weight:600}
.previa{max-width:430px;margin:0 auto;padding:10px 16px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-family:system-ui,sans-serif;font-size:13px;color:var(--mu)}
.previa button{font:inherit;font-size:13px;padding:5px 10px;border:2px solid var(--bd2);background:var(--card);color:var(--tx);cursor:pointer}
.previa button[aria-pressed=true]{background:var(--au);color:#2a1a10;border-color:#fff0b0}
.cel{max-width:430px;margin:8px auto 0;background:var(--fundo);min-height:calc(100vh - 60px);position:relative;padding-bottom:84px;border-left:4px solid #241c2e;border-right:4px solid #241c2e}
@media (max-width:440px){.cel{border:0}}
header.topo{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px;background:#211a2c;border-bottom:4px solid #0e0b12}
header.topo .gnome{flex:1;min-width:0}
header.topo .gnome b{display:block;font-size:17px;color:var(--au);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.topo .gnome span{font-size:12px;color:var(--mu);font-family:system-ui,sans-serif}
.chip{display:inline-flex;align-items:center;gap:5px;background:#2e2416;border:3px solid #6a4a20;padding:3px 8px;font-size:16px;color:#ffe08a;white-space:nowrap}
main{padding:12px 16px}
h2{font-size:19px;margin:18px 0 8px;color:var(--au);display:flex;align-items:center;gap:8px}
h2 small{font-size:12px;color:var(--mu);font-family:system-ui,sans-serif;font-weight:400;margin-left:auto}
.caixa{background:var(--card);border:3px solid var(--bd);box-shadow:inset 0 0 0 2px #1b1626,0 3px 0 #0e0b12;padding:10px 12px;margin-bottom:10px}
.sub{font-family:system-ui,sans-serif;font-size:13px;color:var(--mu);line-height:1.4}
.heroi{display:flex;gap:12px;align-items:stretch}
.heroi .palco{width:46%;flex:none;align-self:flex-start;border:3px solid var(--bd);box-shadow:inset 0 0 0 2px #1b1626;background:#000}
.heroi .palco svg{width:100%;height:auto;display:block}
.heroi .info{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.heroi .nome{font-size:21px;line-height:1.05}
.selo{display:inline-block;font-size:13px;padding:2px 6px;border:2px solid var(--etapa2);background:color-mix(in srgb,var(--etapa) 30%,#1b1626);color:#ffe6d0}
.nivel{display:flex;align-items:baseline;gap:6px}
.nivel b{font-size:38px;line-height:.9;color:#ffe08a}
.nivel span{font-size:14px;color:var(--mu)}
.barra{height:14px;background:#120e18;border:2px solid #0b080e;display:flex;gap:2px;padding:2px}
.barra i{flex:1;background:#2c2436}
.barra i.on{background:linear-gradient(#9af0ff 0 35%,#3ab8d8 35%)}
.barra.gc i.on{background:linear-gradient(#fff0a0 0 35%,#e0a830 35%)}
.barra.fogo i.on{background:linear-gradient(#ffd0a0 0 35%,#e0683a 35%)}
.linha{display:flex;align-items:center;gap:8px;justify-content:space-between}
.linha+.linha{margin-top:6px}
.num{font-size:22px;color:#ffe08a}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grade2 .caixa{margin:0}
.rot{font-size:13px;color:var(--mu);font-family:system-ui,sans-serif}
.btn{font:inherit;font-size:16px;padding:8px 14px;border:3px solid #8a6040;background:#5a3e2a;color:var(--tx);cursor:pointer;box-shadow:inset 0 -3px 0 #3a2618;min-height:44px}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ok{background:#3e6a34;border-color:#6aa05a;box-shadow:inset 0 -3px 0 #24401e}
.btn.neutro{background:#3a2e44;border-color:#6a5470;box-shadow:inset 0 -3px 0 #241c2e}
.btn.rui{background:#7a3030;border-color:#b05050;box-shadow:inset 0 -3px 0 #4a1a1a}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.larga{width:100%}
.conq{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.conq div{background:var(--card2);border:2px solid var(--bd);padding:6px 4px;text-align:center;font-size:11px;line-height:1.15;color:var(--tx)}
.conq div.off{opacity:.45}
.conq div svg{display:block;margin:0 auto 4px}
.conq em{display:block;font-style:normal;color:var(--mu);font-family:system-ui,sans-serif;font-size:10px;margin-top:2px}
.tiers{display:flex;gap:3px;margin:4px 0 2px}
.tiers span{flex:1;text-align:center;font-size:12px;padding:3px 0;background:#241c2e;border:2px solid #3a2e44;color:var(--mu)}
.tiers span.on{background:#4a3a1a;border-color:#a07a30;color:#ffe08a}
.tiers span.eu{outline:2px solid #fff0b0;outline-offset:1px}
.faixa{background:repeating-linear-gradient(45deg,#3e6a34 0 8px,#467a3a 8px 16px);border:3px solid #7ab05a;padding:8px 10px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.item{display:flex;gap:10px;align-items:center}
.item .ic{width:64px;height:64px;flex:none;background:#1b1626;border:3px solid var(--bd);display:grid;place-items:center;position:relative}
.item .ic svg{max-width:48px;max-height:48px}
.item .meio{flex:1;min-width:0}
.item .meio b{font-size:17px;display:block}.item .meio .sub b{font-size:inherit;display:inline}
.item .preco{font-size:18px;color:#ffe08a;white-space:nowrap}
.item .preco s{color:var(--mu);font-size:13px;margin-right:4px}
.item .acao{max-width:42%;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.item .acao .btn{font-size:14px;padding:6px 10px;min-height:40px}
.tag{font-size:11px;padding:1px 5px;border:2px solid var(--bd2);color:var(--mu);font-family:system-ui,sans-serif}
.trancado{opacity:.6}
.esgotado .ic::after{content:"ESGOTADO";position:absolute;bottom:-3px;left:-3px;right:-3px;background:#7a3030;color:#ffd8d0;font-size:10px;text-align:center;border:2px solid #b05050}
.missao .prog{margin:6px 0 4px}
.membros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.membros div{background:var(--card2);border:2px solid var(--bd);padding:3px;text-align:center;font-size:12px;line-height:1.15}
.membros svg{width:100%;height:auto;display:block;margin-bottom:3px}
.membros em{font-style:normal;color:var(--mu);font-size:11px;font-family:system-ui,sans-serif;display:block}
.mural div{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:2px dashed #3a2e44;font-family:system-ui,sans-serif;font-size:13px}
.mural div:last-child{border:0}
.mural svg{flex:none}
.alerta .grav{display:flex;gap:6px;margin:8px 0}
.alerta .grav button{flex:1;font:inherit;font-size:14px;padding:6px 4px;border:3px solid var(--bd2);background:#241c2e;color:var(--tx);cursor:pointer;min-height:40px}
.alerta .grav button[aria-pressed=true].l{background:#5a5a2a;border-color:#c0b050}
.alerta .grav button[aria-pressed=true].m{background:#7a4a20;border-color:#e09040}
.alerta .grav button[aria-pressed=true].g{background:#7a2a2a;border-color:#e05a4a}
.efeito{font-family:system-ui,sans-serif;font-size:12px;color:#f0d0b0;min-height:16px}
.botoes{display:flex;gap:8px}
.botoes .btn{flex:1}
nav.baixo{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;background:#211a2c;border-top:4px solid #0e0b12;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav.baixo button{flex:1;font:inherit;font-size:13px;background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 0;min-height:52px}
nav.baixo button[aria-current=page]{color:#ffe08a}
nav.baixo button[aria-current=page] svg{filter:drop-shadow(0 2px 0 #6a4a20)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);max-width:400px;width:calc(100% - 32px);background:#2e2416;border:3px solid #a07a30;color:#ffe6b0;padding:10px 12px;font-family:system-ui,sans-serif;font-size:14px;z-index:9;display:none}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:8}
.modal .folha{background:var(--fundo);border:4px solid var(--bd2);border-bottom:0;width:100%;max-width:430px;padding:16px;max-height:92vh;overflow:auto}
.modal h3{margin:0 0 8px;color:var(--au);font-size:20px}
.ed{display:flex;gap:10px;align-items:flex-start}
.ed .palco{width:42%;flex:none;position:sticky;top:0;border:3px solid var(--bd)}
.ed .palco svg{width:100%;display:block}
.ctl{flex:1;display:grid;gap:4px}
.lblc{font-family:system-ui,sans-serif;font-size:12px;color:var(--mu);margin-top:4px}
.cores{display:flex;flex-wrap:wrap;gap:3px;align-items:center}.cores button{width:22px;height:22px;border:2px solid #0c0812;padding:0;cursor:pointer}.cores button[aria-pressed=true]{outline:2px solid #fff0a0;outline-offset:1px}.cores input{width:30px;height:26px;border:0;padding:0;background:none}
.ctl .row{display:flex;align-items:center;gap:4px;background:var(--card);border:2px solid var(--bd);padding:2px 4px}
.ctl .row span{flex:1;font-size:12px;color:var(--mu);font-family:system-ui,sans-serif}
.ctl .row b{min-width:76px;text-align:center;font-weight:400;color:var(--au);font-size:13px;line-height:1.05}
.ctl .row button{font:inherit;font-size:16px;width:30px;height:30px;border:2px solid var(--bd2);background:#3a2e44;color:var(--tx);cursor:pointer;padding:0}
.sexo{display:flex;gap:6px;margin-bottom:6px}
.sexo button{flex:1;font:inherit;font-size:14px;padding:6px;border:3px solid var(--bd2);background:#241c2e;color:var(--tx);cursor:pointer}
.sexo button[aria-pressed=true]{background:var(--au);color:#2a1a10;border-color:#fff0b0}
.nota{font-family:system-ui,sans-serif;font-size:12px;color:var(--mu);margin:6px 0 0;line-height:1.4}
.evento{border-color:var(--bd2);padding:0;overflow:hidden}
.evento .cab{display:flex;gap:10px;align-items:center;padding:10px 12px;background:linear-gradient(90deg,color-mix(in srgb,var(--etapa) 35%,#241c2e),#241c2e)}
.evento .cab b{font-size:19px;display:block;line-height:1.1}
.evento .corpo{padding:10px 12px;display:grid;gap:10px}
.st{font-size:12px;padding:2px 6px;border:2px solid;white-space:nowrap;margin-left:auto}
.st.vivo{color:#d8ffd0;border-color:#7ab05a;background:#2e4a28}
.st.breve{color:#ffe6b0;border-color:#a07a30;background:#3a2e16}
.st.reino{color:#e6d8ff;border-color:#8a70c0;background:#2e2448}
.cont{display:flex;gap:4px;align-items:flex-end}
.cont div{background:#120e18;border:2px solid #0b080e;min-width:52px;text-align:center;padding:4px 2px 2px}
.cont div b{display:block;font-size:24px;color:#ffe08a;line-height:1;font-variant-numeric:tabular-nums}
.cont div span{font-size:10px;color:var(--mu);font-family:system-ui,sans-serif}
.cont .rot{margin-left:6px;align-self:center}
.metas{position:relative}
.marcos{display:flex;justify-content:space-between;font-family:system-ui,sans-serif;font-size:11px;color:var(--mu);margin-top:3px}
.marcos span.ok{color:#9ae08a}
.premios{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.premios div{background:var(--card2);border:2px solid var(--bd);padding:6px 8px;font-family:system-ui,sans-serif;font-size:12px;color:var(--tx);line-height:1.35}
.premios div b{display:block;font-family:"Pixelify Sans",monospace;font-size:13px;color:var(--au);margin-bottom:2px}
.regras{margin:6px 0 0;padding-left:18px;font-family:system-ui,sans-serif;font-size:13px;line-height:1.45;color:var(--tx)}
.regras li+li{margin-top:4px}
.grade3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{font:inherit;color:var(--tx);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;margin:0}
.kpi .num{font-size:26px}.alerta-k{border-color:#b05050}.alerta-k .num{color:#ff9a8a}
.h3{font-size:16px;margin:16px 0 8px;color:var(--tx);display:flex;gap:6px;align-items:baseline}.h3 small{font-size:12px;color:var(--mu);font-family:system-ui,sans-serif;font-weight:400;margin-left:auto}
.cadeia{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:8px 0 2px}
.passo{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 6px;border:2px solid #3a2e44;background:#1b1626;color:var(--mu)}
.passo i{width:8px;height:8px;display:inline-block}.passo em{font-style:normal;font-family:system-ui,sans-serif;font-size:11px;opacity:.85}
.passo.ok{color:#c8f0b8;border-color:#4a7a3a}.passo.vez{color:#ffe08a;border-color:#c09030;background:#3a2e16}.passo.nao{color:#ffb0a0;border-color:#a04a40}
.seta{color:var(--mu)}
.pedido.atrasado{border-color:#a04a40}
.regua{display:grid;gap:6px}.regua summary{cursor:pointer;list-style:none}.regua summary::-webkit-details-marker{display:none}.regua[open] summary{margin-bottom:4px}.regua-l{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:start}
.abinhas{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}.abinhas button{font:inherit;font-size:14px;padding:6px 10px;border:3px solid var(--bd2);background:#241c2e;color:var(--mu);cursor:pointer;min-height:40px}
.abinhas button[aria-selected=true]{background:var(--au);color:#2a1a10;border-color:#fff0b0}
.tabela{padding:4px 8px}.lm{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:2px dashed #3a2e44}.lm:last-child{border:0}
.lm .mini{width:34px;flex:none;background:#000}.lm-n{flex:1;min-width:0}.lm-n b{display:block;font-size:15px}.lm em,.lm-v em{font-style:normal;font-size:11px;color:var(--mu);font-family:system-ui,sans-serif;display:block}
.lm-v{text-align:right;min-width:52px}.mini-b{font-size:12px!important;padding:4px 8px!important;min-height:36px!important}
.inp{font:inherit;font-size:15px;background:#120e18;color:var(--tx);border:3px solid var(--bd2);padding:6px 8px;min-width:0;flex:1;min-height:44px}
.mural .novo{background:linear-gradient(90deg,#2e2416,transparent)}.ponto{width:8px;height:8px;background:#ffd060;flex:none}
.q{font-style:normal;display:block;font-size:11px;color:var(--mu)}
.resp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.resp div{background:var(--card2);border:2px solid var(--bd);padding:6px;display:flex;gap:8px;align-items:center}
.resp svg{width:56px;height:auto;flex:none;display:block}
select.inp{appearance:auto}
[hidden]{display:none!important}
.somb{flex:none;width:36px;height:34px;display:grid;place-items:center;background:var(--card2);border:3px solid var(--bd);cursor:pointer;padding:0}
.somaj label{display:grid;grid-template-columns:78px 1fr 40px 34px;align-items:center;gap:8px;font-size:15px;margin:10px 0}
.somaj output{font-size:14px;color:var(--au);text-align:right}
.somaj .mudo{font:inherit;width:34px;height:30px;padding:0;background:var(--card2);border:2px solid var(--bd2);cursor:pointer;display:grid;place-items:center}
.somaj .mudo[aria-pressed=true]{background:#3a1e22;border-color:var(--rui)}
.somaj input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;background:#120e18;border:2px solid var(--bd2);outline:none}
.somaj input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:22px;background:var(--au);border:2px solid #2a1a10;box-shadow:inset -3px -3px 0 #a86a1c;cursor:pointer}
.somaj input[type=range]::-moz-range-thumb{width:14px;height:20px;background:var(--au);border:2px solid #2a1a10;border-radius:0;cursor:pointer}
.somaj input[type=range]:focus-visible{border-color:var(--au)}
[data-fx],[data-conq]{cursor:pointer}
.recep{display:flex;gap:12px;align-items:center}
#t-heroi .abinhas{flex-wrap:nowrap}#t-heroi .abinhas button{flex:1;padding:6px 2px;font-size:13px;min-width:0}
nav.baixo:has(button:nth-child(6)) button{font-size:11px}
.invg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.inv{font:inherit;color:var(--tx);background:var(--card);border:3px solid var(--bd);box-shadow:inset 0 0 0 2px #1b1626,0 3px 0 #0e0b12;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;cursor:pointer;line-height:1.1}
.inv b{font-size:13px;font-weight:400}.inv span{font-family:system-ui,sans-serif;font-size:11px;color:var(--mu)}
.recep svg{flex:none}
.recep .meio{flex:1;min-width:0}
#t-login{min-height:calc(100vh - 70px);display:flex;flex-direction:column;padding:18px 16px 24px;background:linear-gradient(#211a34,#1b1626 55%)}
#t-login .titulo{text-align:center;margin:6px 0 4px}
#t-login .titulo b{display:block;font-size:30px;line-height:1;color:#ffe08a;text-shadow:3px 3px 0 #0e0b12}
#t-login .titulo span{font-family:system-ui,sans-serif;font-size:13px;color:var(--mu)}
#t-login .herois{display:flex;justify-content:center;align-items:flex-end;gap:0;margin:10px 0 0}
#t-login .herois svg{width:31%;height:auto;display:block}
#t-login .chao{height:12px;background:repeating-linear-gradient(90deg,#5e9a4a 0 8px,#4a8a3a 8px 16px);border-top:4px solid #8ac06a;border-bottom:4px solid #24401e;margin-bottom:16px}
#t-login label{font-size:15px;display:block;margin-bottom:6px}
#t-login .inp{width:100%}
#t-login .dica{font-family:system-ui,sans-serif;font-size:12px;color:var(--mu);margin-top:8px;line-height:1.4}
#t-login .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#t-login .chips button{font:inherit;font-size:12px;padding:4px 8px;background:#241c2e;border:2px dashed var(--bd2);color:var(--mu);cursor:pointer}
#t-login .codigo{display:flex;gap:6px;justify-content:center;margin:10px 0}
#t-login .codigo input{width:42px;height:52px;text-align:center;font:inherit;font-size:26px;background:#120e18;color:#ffe08a;border:3px solid var(--bd2)}
#t-login .codigo input:focus{outline:none;border-color:var(--au)}
#t-login .bloq{background:#262230;border:3px solid #5a5464;box-shadow:inset 0 0 0 2px #17141d;padding:14px}
#t-login .bloq p{font-family:system-ui,sans-serif;font-size:14px;line-height:1.45;color:#cfc8d4;margin:8px 0 0}
#t-login .passos{display:grid;gap:6px;margin:10px 0 14px;font-family:system-ui,sans-serif;font-size:13px;color:var(--tx)}
#t-login .passos div{display:flex;gap:8px;align-items:center;background:var(--card2);border:2px solid var(--bd);padding:6px 8px}

function bauSorte(){const sorte=Math.random(),r=sorte<.45?"Comum":sorte<.72?"Incomum":sorte<.88?"Rara":sorte<.97?"Épica":"Lendária";

 limpar();const cor=RAR[r];const n=el(`<div class="ov" role="dialog" aria-modal="true" aria-label="Baú da Sorte" style="--c:#e8b04a"><div class="raios" style="opacity:0"></div><div class="cx"><div class="ico" id="bz">${icone("bau",120)}</div><div><span class="rot">BAÚ DA SORTE</span></div><h3 id="bt">Abrindo…</h3><p id="bp">10 caixas perfeitas seguidas.</p><div class="fechar" id="bf" style="visibility:hidden">Toque para fechar</div></div></div>`);
 requestAnimationFrame(()=>requestAnimationFrame(()=>n.classList.add("on")));let ok=false;const bz=n.querySelector("#bz");bz.style.animation="none";
 [300,800,1300].forEach((t,i)=>setTimeout(()=>{bz.classList.add("treme");som("sacode");setTimeout(()=>bz.classList.remove("treme"),260)},t));
 setTimeout(()=>{ok=true;baixar(3);bz.innerHTML=icone("bauab",120);bz.style.animation="";n.style.setProperty("--c",cor);n.querySelector(".raios").style.opacity=1;n.querySelector(".rot").textContent=r.toUpperCase();n.querySelector("#bt").textContent=ITEM[r];n.querySelector("#bp").textContent=`Item ${r.toLowerCase()} foi para o seu inventário.`;n.querySelector("#bf").style.visibility="visible";som("abrir",r);
  const ord=Object.keys(RAR).indexOf(r),cs=[cor,"#fff3dc",claro(cor,.45)];const b=bz.getBoundingClientRect();particulas(b.left+b.width/2,b.top+b.height*.45,30+ord*25,cs,{vel:3+ord*1.2,vida:60,cima:2});if(ord>=3){confete(80,cs)}if(ord>=3)setTimeout(()=>som("fanfarra"),700)},1800);
 n.onclick=()=>{if(!ok)return;n.classList.remove("on");setTimeout(()=>n.remove(),300)}}
function contagem(){limpar();let s=10;const n=el(`<div class="relogio" role="timer" style="--c:${G().cor}"><span>${{min:"Grande Fundição",gua:"Grande Convergência",elf:"Grande Vigília"}[gk]} fecha em</span><b id="rb">00:10</b></div>`);requestAnimationFrame(()=>requestAnimationFrame(()=>n.classList.add("on")));som("tique",false);
 tRel=setInterval(()=>{s--;const b=n.querySelector("#rb");b.textContent="00:"+String(s).padStart(2,"0");b.classList.remove("bate");void b.offsetWidth;if(s<=3)b.classList.add("bate");som("tique",s<=3);
  if(s<=0){clearInterval(tRel);n.classList.remove("on");setTimeout(()=>{n.remove();media({ico:"sino",icoCor:G().cor,cor:G().cor,rot:"EVENTO ENCERRADO",tit:"A guilda bateu as metas",txt:"Recompensas entram no seu GC pendente.",s:"jingle"})},300)}},1000)}

  ${CATALOGO.map(it=>{const resta=it.qtd-it.usados,lib=it.liberado!=null?it.liberado:it.tier<=tier,p=it.preco!=null?it.preco:precoFinal(it.gc),fechada=LOJA_SRV&&!LOJA_SRV.aberta;
    const cls=!lib?"trancado":resta<=0?"esgotado":"";
    let acao;
    if(!lib)acao=`<span class="tag">${icone("cadeado",CINZAc,12)} libera no nível ${it.nivel||it.tier*10}</span>`;
    else if(fechada)acao=`<button class="btn" disabled>Em breve</button>`;

    else acao=`<button class="btn ok" data-comprar="${it.id}" ${J.gc<p?"disabled":""}>Resgatar</button>`;
    return `<div class="caixa item ${cls}"><div class="ic">${iconeItem(it)}</div>
      <div class="meio"><b>${it.nome}</b><div class="sub">${it.desc}</div><div class="sub">Tier ${it.tier} · ${lib?(resta>0?`restam ${resta} este mês`:"volta no dia 1"):`${it.qtd} por mês`}</div></div>
      <div class="acao"><span class="preco">${p<it.gc?`<s>${it.gc}</s>`:""}${p} GC</span>${acao}</div></div>`}).join("")}

function efeito(k){
  const n=nivelDe(J.xp),tier=Math.floor(n/10),F=FAIXAS[A.guilda],g=GUILDA[A.guilda];
  if(k==="nivel")return SFX.media({ico:"seta",cor:"#7fc46a",rot:"NÍVEL NOVO",tit:`Nível ${n}`,txt:`Faltam ${xpPara(n+1)-J.xp} XP para o ${n+1}.`,s:"nivel"});
  if(k==="faixa"){const t=Math.max(1,tier);return SFX.grande({cor:et().cor[1],rot:"NOVA FAIXA",tit:F[t],txt:`Você chegou ao nível ${t*10}. Seu ${g.art} passou de ${MATERIAL[t-1][0]} para ${MATERIAL[t][0]} e a roupa ganhou um detalhe novo.`,mural:1,corpo:`<div class="troca"><span class="velho">${bau(t-1,64)}</span><span class="seta">▶</span><span class="ico">${bau(t,104)}</span></div>`})}
  if(k==="punicao")return SFX.sobria({tit:"Ajuste no seu XP",txt:"A gerência corrigiu −40 XP do dia 24/11 depois de uma verificação. Seu saldo de GC não fica negativo.",mot:"Caixa CX-10381 registrada duas vezes no mesmo dia. O registro repetido foi retirado.",acoes:["Falar com a supervisão","Entendi"]});
  if(k==="poderok")return SFX.media({ico:"pocao",cor:"#8a5ad0",icoCor:"#8a5ad0",rot:"PODER APROVADO",tit:"Ampulheta do Almoço",txt:`+10 min de almoço hoje. Aprovado por ${g.sup}.`,s:"aprovado"});
  if(k==="manual"){aba="heroi";heroiSub="manual";telaHeroi();navegar();window.scrollTo(0,0);return}
  if(k==="receptaculo"){const r=receptaculo(),falta=r.capacidade-r.preenchido;J.recep=r.capacidade;tudo();SFX.som("moeda",4);setTimeout(()=>{SFX.media({ico:"moeda",cor:"#e8b04a",rot:"RECEPTÁCULO CHEIO",tit:`${r.capacidade} GC pagos agora`,txt:`Faltavam ${falta} GC. O pagamento saiu antes do fechamento da semana e o receptáculo começa vazio de novo.`,s:"resgate"});J.gc+=r.capacidade;J.recep=0;tudo();SFX.contarGC()},900);return}
  if(k==="gcval"){SFX.pequena({ico:"moeda",cor:"#e8b04a",tit:"+35 GC validados",txt:"A pesagem de ontem foi conferida.",s:["moeda",3]});setTimeout(SFX.contarGC,250);return}
}
function efeitoConq(i){const [t,,,r,pc]=CONQ[i],c=SFX.RAR[r],ouro=r==="Épica"||r==="Lendária";
  if(r==="Comum")return SFX.pequena({ico:"trofeu",cor:c,tit:t,txt:`Conquista comum · ${pc}% têm · +20 GC`,s:"plim"});

function trocarVitrine(i){const feitas=minhasCQ().filter(c=>grauDe(c));

function reverCQ(id){const c=CQ.find(x=>x.id===id),g=grauDe(c),r=rarDe(c.pct[g-1]),cor=SFX.RAR[r],gt=c.graus.length>1?` ${GRAU[g-1]}`:"";
  if(c.pio)return SFX.grande({ico:"coroa",cor:"#f0d070",rot:"PIONEIRO",tit:c.nome,txt:"Você foi a primeira pessoa do Reino a conseguir esta conquista.",mural:1,s:["fanfarra",true]});

const API_PADRAO="https://script.google.com/macros/s/AKfycbzfZp22dONNOxecyskVJwesEriFNcqhoUvYM7YACDQGSI0a9dNmVJi0UZMlzGi8v3NB/exec"; // na publicação: a URL /exec da implantação "Reino API"
const ON=(()=>{let u="";try{const q=new URLSearchParams(location.search).get("api");if(q)localStorage.setItem("reinoApi",q);u=q||localStorage.getItem("reinoApi")||""}catch(e){}return u||API_PADRAO})();
let TOKEN=null;try{TOKEN=localStorage.getItem("reinoToken")}catch(e){}
let SRV=null,RECEP_SRV=null,EV_SRV=null,LOJA_SRV=null,RODADAS_SRV=[],MEMBROS_SRV=null,CQ_ONLINE=false,ocupado=false;
const GU_MAP={GRAMPOMINAS:"min",CRONOMINAS:"gua",ELFOS:"elf"},PAPEL_MAP={OPERADOR:"op",SUPERVISOR:"sup",COORDENADOR:"coo",GERENTE:"ger"};
const RAR_MAP={COMUM:"Comum",INCOMUM:"Incomum",RARA:"Rara",EPICA:"Épica",LENDARIA:"Lendária"},RAR_PCT={Comum:60,Incomum:30,Rara:10,Épica:3,Lendária:0.5};
const GRAU_IDX={UNICO:1,BRONZE:1,PRATA:2,OURO:3};
const ACENTO={"Ampulheta do Almoco":"Ampulheta do Almoço","Pocao da Calmaria":"Poção da Calmaria","Brasao personalizado":"Brasão personalizado","Equipamento lendario 3D":"Equipamento lendário 3D","Constancia":"Constância","Mao firme":"Mão firme","Destaque do mes":"Destaque do mês","Meta da guilda":"Meta da guilda"};
const ac=s=>ACENTO[s]||s;
const dataBR=iso=>{const m=String(iso||"").match(/(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}`:String(iso||"")};
const isoDe=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const guardarTk=t=>{TOKEN=t;try{t?localStorage.setItem("reinoToken",t):localStorage.removeItem("reinoToken")}catch(e){}};
async function api(acao,dados={}){
  let r;try{r=await fetch(ON,{method:"POST",body:JSON.stringify({acao,token:TOKEN||undefined,...dados})})}catch(e){throw new Error("Sem conexão com o Reino. Confira a internet e tente de novo.")}
  let j;try{j=await r.json()}catch(e){throw new Error("O servidor do Reino não respondeu direito. Tente de novo em instantes.")}
  if(!j.ok&&j.codigo==="SESSAO"&&acao!=="entrar"&&acao!=="pedirCodigo"){guardarTk(null);abrirLogin();throw new Error("Sua sessão acabou. Entre de novo.")}
  if(!j.ok)throw new Error(j.erro||"Não deu certo. Tente de novo.");return j}
async function chamar(acao,dados,ok){if(ocupado)return;ocupado=true;try{const r=await api(acao,dados);await ok(r)}catch(e){toast(e.message)}finally{ocupado=false}}

function avatarLocal(id){try{return JSON.parse(localStorage.getItem("reinoAv_"+id)||"null")}catch(e){return null}}
function aplicarEstado(e){SRV=e;const j=e.jogador;papel=PAPEL_MAP[j.papel]||"op";aba=papel==="op"?(["inicio","eventos","loja","heroi","guilda"].includes(aba)?aba:"inicio"):(["linicio","aprov","resg","gctl","avisos","itens"].includes(aba)?aba:"linicio");
  const g=GU_MAP[j.guilda]||"min",av=j.avatar||avatarLocal(j.id);
  if(papel==="op"){A=av&&av.guilda?{...av,guilda:g}:{guilda:g,etapa:0,...PADRAO[g][(A&&A.sexo)||"m"]};if(j.etapa!=null&&ETAPAS[g][j.etapa])A.etapa=j.etapa}
  else{if(av&&av.guilda)AL[papel]=av;NOMEL[papel]=j.nome}
  J.nome=j.nome;J.aguarda=0;

  if(d.pvit||d.vsel){setTimeout(()=>api("vitrine",{ids:VITRINE}).catch(er=>toast(er.message)),0);return}
  if(d.equipar){para();const us=INV.filter(x=>x.id===d.equipar),on=!us.some(x=>x.eq),u=(us.find(x=>x.eq)||us[0]);fecharModal();
    chamar("equipar",{unidade:u.u,equipado:on},()=>depois(on?"Equipado no avatar.":"Tirado do avatar."));return}
  if(d.usar){para();const it=ITEM(d.usar),un=INV.find(x=>x.id===d.usar&&!x.res),dia=$("usoDia").value;if(!un)return;fecharModal();
    chamar("pedirUso",{unidade:un.u,dia},r=>depois(null,()=>r.uso.status==="APROVADO"?SFX.media({ico:it.ic,cor:SFX.RAR[it.rar],icoCor:SFX.RAR[it.rar],rot:"PODER ATIVO",tit:it.nome,txt:r.mensagem||"Pronto para usar.",s:"aprovado"}):SFX.pequena({ico:it.ic,cor:SFX.RAR[it.rar],tit:"Pedido enviado",txt:r.mensagem||"A supervisão vai confirmar.",s:"plim"})));return}
  if(d.confirma){para();const it=CATALOGO.find(c=>c.id===d.confirma);fecharModal();
    chamar("resgatar",{item:it.id},r=>depois(null,()=>{SFX.media({ico:"moeda",cor:"#e8b04a",rot:"RESGATE PEDIDO",tit:it.nome,txt:`Saldo agora: ${fmt(r.gc)} GC. A supervisão foi avisada e vai entregar.`,s:"resgate"});setTimeout(SFX.contarGC,300)}));return}
  if(d.pedok){const p=PED.find(x=>x.id==d.pedok);if(p&&p.srv){para();decidirSrv(p,"APROVADO");return}}
  if(d.pedrec){const p=PED.find(x=>x.id==d.pedrec);if(p&&p.srv){para();pedirMotivo(p);return}}
  if(d.recok){para();const p=PED.find(x=>x.id==d.recok),m=($("recMot").value||"").trim();if(!m){toast("Escreva o motivo. A pessoa vê.");return}fecharModal();decidirSrv(p,"RECUSADO",m);return}
  if(d.lidas!==undefined){para();chamar("marcarLidas",{ids:"todas"},()=>depois("Avisos marcados como lidos."));return}
  if(d.entregue){para();const r=RESG.find(x=>x.id==d.entregue);chamar("entregar",{resgate:r.id},()=>{RESG_E.unshift({...r,quando:"agora",por:NOMEL[papel]});return depois(`Entregue. ${r.quem} foi avisado.`)});return}
  if(d.enviaest){para();const r=RESG.find(x=>x.id==d.enviaest),m=($("motivo").value||"").trim();if(!m){toast("Escreva o motivo.");return}fecharModal();chamar("estornar",{resgate:r.id,motivo:m},x=>depois(ac(x.mensagem)||"Estorno enviado."));return}
  if(d.novoped!==undefined){para();novoAjuste();return}
  if(d.ajok!==undefined){para();const j=$("ajJ").value,g=+$("ajG").value||0,x=+$("ajX").value||0,m=($("ajM").value||"").trim();if(!j){toast("Escolha o jogador.");return}if(!g&&!x){toast("Digite o GC ou o XP.");return}if(!m){toast("Escreva o motivo. A pessoa vê.");return}
    fecharModal();chamar("ajustar",{jogador:j,gc:g||undefined,xp:x||undefined,motivo:m},()=>depois("Ajuste enviado para aprovação."));return}
  if(d.consol){para();chamar("consolidar",{rodada:d.consol},r=>depois("Semana fechada. Os GC entram na próxima atualização, em até 15 minutos.",()=>SFX.pequena({ico:"moeda",cor:"#e8b04a",tit:"Semana fechada",txt:"Cada operador recebe o aviso dos GC liberados.",s:["moeda",3]})));return}
  if(d.itsalvar!==undefined){para();const id=d.itsalvar||null,old=id?ITEM(id):null,n=$("itN").value.trim();if(!n){toast("Dê um nome ao item.");return}const conf=$("itC").value;
    const it={id:id||n.normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,24),nome:n,tipo:conf==="-"?"VISUAL":"PODER",raridade:(Object.keys(RAR_MAP).find(k=>RAR_MAP[k]===$("itR").value)||"COMUM"),
      aprova:conf==="-"?"":conf==="coo"?"COORDENADOR":conf==="auto"?"AUTOMATICO":"SUPERVISOR",descricao:$("itE").value.trim(),validade_dias:+$("itV").value||0,ativo:old?!old.off:true};
    fecharModal();chamar("alterarItem",{item:it},r=>depois(null,()=>SFX.pequena({ico:"sino",cor:"#e8b04a",tit:"Manual atualizado",txt:`${r.avisados} jogadores receberam o aviso.`,s:"plim"})));return}
  if(d.itoff){para();const o=ITEM(d.itoff);const it={id:o.id,nome:o.nome,tipo:o.tipo==="visual"?"VISUAL":"PODER",raridade:Object.keys(RAR_MAP).find(k=>RAR_MAP[k]===o.rar)||"COMUM",aprova:o.conf==="-"?"":o.conf==="coo"?"COORDENADOR":o.conf==="auto"?"AUTOMATICO":"SUPERVISOR",descricao:o.ef,validade_dias:o.val||0,ativo:!!o.off};
    fecharModal();chamar("alterarItem",{item:it,motivo:it.ativo?"Item reativado":"Item desativado"},()=>depois(it.ativo?`${o.nome} reativado.`:`${o.nome} desativado. Ninguém ganha nem usa até reativar.`));return}
  if(d.diok){para();const j=$("diJ").value,item=$("diI").value,m=$("diM").value.trim();if(!m){toast("Escreva o motivo. A pessoa sempre vê o motivo.");return}fecharModal();
    chamar(d.diok==="dar"?"concederItem":"retirarItem",{jogador:j,item,motivo:m},r=>depois(ac(r.mensagem)));return}
  if(d.chsalvar!==undefined){para();const v=[...document.querySelectorAll("[data-chance]")].map(x=>+x.value||0),t=v.reduce((a,b)=>a+b,0);if(t!==100){toast(`A soma está em ${t}%. Precisa dar 100%.`);return}
    chamar("chancesBau",{chances:RARS.map((r,i)=>({raridade:Object.keys(RAR_MAP).find(k=>RAR_MAP[k]===r),chance:v[i]}))},r=>{CHANCES=v;toast("Chances salvas. Todos os jogadores foram avisados.");telaLider()});return}
}

const BOTAO_SAIR=()=>ON?`<button class="btn neutro larga" data-sair style="margin-top:14px">Sair da conta</button>`:"";
function perfilLiderOn(){const c=papel,pend=PED.length,nov=AVISOS.filter(a=>a.novo).length,j=SRV.jogador;
  return `<div class="caixa heroi"><div class="palco">${svg(AL[c])}</div><div class="info">
    <div class="nome">${j.nome}</div><div>${selo(c,CLASSES[c].nome)}</div>
    <div class="sub">${CLASSES[c].cargo}${c==="sup"?" · "+(GUILDA[GU_MAP[j.guilda]]||{nome:""}).nome:" · todas as guildas"}</div>
    <div class="sub">Classes de liderança têm personagem, mas não ganham XP nem GC.</div>
    <button class="btn neutro" data-acao="editarL" style="margin-top:auto">Editar avatar</button></div></div>
   <div class="grade3">
    <button class="caixa kpi" data-aba="aprov"><span class="num">${pend}</span><span class="rot">para decidir</span></button>
    <button class="caixa kpi" data-aba="${c==="ger"?"avisos":"resg"}"><span class="num">${c==="ger"?nov:RESG.length}</span><span class="rot">${c==="ger"?"avisos novos":"resgates a entregar"}</span></button>
    <button class="caixa kpi" data-aba="avisos"><span class="num">${nov}</span><span class="rot">avisos novos</span></button>
   </div>
   <h3 class="h3">Fechar a semana <small>paga os GC da semana</small></h3>${rodadasHtml()}${BOTAO_SAIR()}`}
function guildaLOnline(){const ms=MEMBROS_SRV||[],ls=LIDER_SRV||[],g=GU_MAP[SRV.jogador.guilda]||"min";
  const linha=(m,lid)=>{const k=L_PAPEL[m.papel],a=m.avatar&&m.avatar.guilda?m.avatar:lid?{guilda:k,etapa:0,...PADRAO[k].m}:{guilda:g,etapa:0,...PADRAO[g].m};
    return `<div class="lm"><span class="mini">${svg(lid?a:{...a,guilda:g}).replace("<svg ",'<svg style="width:34px;height:auto;display:block" ')}</span><span class="lm-n"><b>${m.nome}</b><em>${lid?CLASSES[k].cargo:`nível ${m.nivel} · faixa ${m.faixa} · ${m.conquistas} conquistas`}</em></span></div>`};
  return `<h2 style="margin-top:4px">${icone("escudo",OUROc,20)} ${GUILDA[g].nome} <small>${ms.length} membros</small></h2>
   ${ls.length?`<h3 class="h3">Liderança</h3><div class="caixa tabela">${ls.map(m=>linha(m,1)).join("")}</div>`:""}
   <h3 class="h3">Operadores</h3><div class="caixa tabela">${ms.map(m=>linha(m,0)).join("")||`<div class="sub">Ninguém cadastrado ainda na aba Jogadores.</div>`}</div>
   <button class="btn neutro larga" data-novoped style="margin-top:10px">Pedir bônus ou ajuste</button>
   <p class="nota">Em ordem alfabética, sem GC e sem erros. Para ver o perfil de alguém, peça a ela que mostre o app.</p>`}
document.addEventListener("input",e=>{const i=e.target;if(!i.closest||!i.closest(".codigo"))return;const ins=[...document.querySelectorAll(".codigo input")],v=i.value.replace(/\D/g,"");
  if(v.length>1){v.split("").slice(0,6).forEach((c,k)=>{if(ins[k])ins[k].value=c});(ins[Math.min(5,v.length-1)]||i).focus();if(v.length>=6&&ON)loginCodigo();return}
  i.value=v;if(v){const n=ins[ins.indexOf(i)+1];if(n)n.focus();else if(ON&&ins.every(x=>x.value))loginCodigo()}});

if(ON)iniciarOnline();else tudo();
