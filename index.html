.rn-grade .rn-g svg{width:100%;height:auto;display:block;margin-bottom:3px}.rn-grade .rn-g span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rn-grade .rn-g em{font-style:normal;font-size:11px;color:var(--mu)}

function spans(o){const s=new Set();for(const y in o)for(const [a,b] of o[y])for(let x=a;x<=b;x++)s.add(x+","+y);return s}

const M=(...os)=>{const o={};for(const q of os)for(const y in q)(o[y]=o[y]||[]).push(...q[y]);return o};
const P=(...pts)=>{const o={};pts.forEach(([x,y])=>(o[y]=o[y]||[]).push([x,x]));return o};
const espelho=(o)=>{const r={};for(const y in o)r[y]=o[y].map(([a,b])=>[31-b,31-a]);return M(o,r)}; // eixo entre 15 e 16
function linha(x0,y0,x1,y1,w=2){const o={};const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0));for(let i=0;i<=n;i++){const x=Math.round(x0+(x1-x0)*i/n),y=Math.round(y0+(y1-y0)*i/n);(o[y]=o[y]||[]).push([x,x+w-1])}return o}

function cadeia(p){const ini=p.de==="op"?(p.tipo==="usoItem"?0:1):ORDEM.indexOf(p.de),fim=Math.max(ORDEM.indexOf(p.ate),ORDEM.indexOf(p.nivel));const passos=ORDEM.slice(ini,fim+1);
  const chip=(cls,cor,t,st)=>`<span class="passo ${cls}"><i style="background:${cor}"></i>${t}<em>${st}</em></span>`;
  const out=[];if(p.de==="op")out.push(chip("ok","#9ae08a","Operador",`${p.quem} pediu`));
  passos.forEach(c=>{const iC=ORDEM.indexOf(c),iN=ORDEM.indexOf(p.nivel);let st,cls;
   if(c===p.de){st="pediu";cls="ok"}
   else if(p.passou.includes(c)){st="aprovou";cls="ok"}
   else if(p.status==="aprovado"){st="aprovou";cls="ok"}
   else if(iC<iN&&p.subiu){st="48 h sem decisão";cls="nao"}
   else if(iC<iN){st="aprovou";cls="ok"}
   else if(c===p.nivel){st=p.subiu?"recebeu por atraso":"aguardando";cls="vez"}
   else{st="depois";cls=""}
   out.push(chip(cls,CLASSES[c].cor,CLASSES[c].cargo,st))});
  return `<div class="cadeia">${out.join('<span class="seta">›</span>')}</div>`}

    const pal={a:R[0],b:R[1],c:R[2]};const pts={};ic.forEach((row,j)=>[...row].forEach((ch,i)=>{if(pal[ch])pts[(ox+i)+","+(oy+j)]=pal[ch]}));

  else{const nid="N"+Date.now();ITENS.push({id:nid,nome:n,ef:$("itE").value||"Efeito a descrever.",rar:$("itR").value,val:+$("itV").value||null,conf:$("itC").value,tipo:$("itC").value==="-"?"visual":"poder",ic:/coroa/i.test(n)?"coroa":/tocha|fogo/i.test(n)?"chama":/escudo/i.test(n)?"escudo":/chave/i.test(n)?"chave":/ampulheta|tempo/i.test(n)?"ampulheta":"pocao",como:"A definir"});MANUAL.novos.push(nid)}

function darItem(modo){

function confirmarDar(modo){const q=$("diJ").value,it=ITEM($("diI").value),m=$("diM").value.trim();if(!m){toast("Escreva o motivo. A pessoa sempre vê o motivo.");return}

  setTimeout(()=>SFX.sobria({tit:"Um item foi retirado",txt:`A coordenação retirou 1 ${it.nome} do seu inventário. Seu GC e seu XP não mudam.`,mot:m,acoes:["Falar com a supervisão","Entendi"]}),400)}

  try{const [c,r,p,pd]=await Promise.all([api("cotacoes"),api("receptaculos"),api("pesagens",{desde:hojeISO()}),papel!=="sup"?api("pendentes").catch(()=>null):null]);PES_ANALISE=(pd&&pd.pesagens)||[];
    const cot=(c.cotacoes||[]).map(normCot),recs=(r.jogadores||[]).map(normRec);

    (p.pesagens||[]).filter(x=>String(x.data).slice(0,10)===hojeISO()).forEach(x=>{const rr=recs.find(q=>q.jogador===x.jogador);if(rr)rr.hoje.push({id:x.id,liquido:+x.liquido,gc:+x.gc,cancelada:!!x.cancelada,minha:!!x.pode_cancelar})});
    const hist=[];cot.forEach(k=>k.hist.forEach((h,i)=>hist.push({desde:h.desde,material:k.material,de:k.hist[i+1]?+k.hist[i+1].gc_por_g:null,para:+h.gc_por_g,quem:h.quem||"",motivo:h.motivo||""})));hist.sort((a,b)=>a.desde<b.desde?1:-1);
    PES={cotacoes:cot,historico:hist,recs,pode_mudar:!!c.pode_mudar};if(papel==="sup"&&!MIC)await carregarMic()}
  catch(e){PES={erro:e.message}}}
const cotDe=mat=>(PES.cotacoes||[]).find(c=>c.material===mat)||{gc_por_g:1,ritmo_dias:7,material:mat};
function encheDe(r){if(!r.ultima)return null;const c=cotDe(r.material);return Math.round(diasDesde(r.ultima.data)/(c.ritmo_dias||7)*100)}
const rostoRec=r=>{const g=GU_MAP[r.guilda]||"min",a=r.avatar&&r.avatar.guilda?{...r.avatar,guilda:g}:{guilda:g,etapa:r.etapa||0,...PADRAO[g][r.sexo||"m"]};return rosto(a)};

    r.hoje.push({id:p.id,liquido:+p.liquido||k.liq,gc:+p.gc||0,minha:true});r.ultima={data:hojeISO(),liquido:+p.liquido||k.liq,gc:+p.gc||0};PES_BR="";toast(x.mensagem||`${r.nome} recebeu ${fmt(+p.gc||0)} GC.`)}

function spark(h){h=h&&h.length>1?h:[(h||[1])[0],(h||[1])[0]];const w=300,hh=46,mn=Math.min(...h)*0.95,mx=Math.max(...h)*1.05||1,X=i=>4+i*(w-8)/(h.length-1),Y=v=>hh-4-(v-mn)/((mx-mn)||1)*(hh-10);
  const pts=h.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="${w}" y1="${hh-2}" y2="${hh-2}" stroke="#3a2e44" stroke-width="1"/><polygon points="4,${hh-2} ${pts} ${w-4},${hh-2}" fill="#e8b04a" fill-opacity=".14"/><polyline points="${pts}" fill="none" stroke="#e8b04a" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${X(h.length-1)}" cy="${Y(h[h.length-1])}" r="3.5" fill="#ffe08a"/></svg>`}

    return `<div class="caixa ativo"><div><b style="font-size:16px">${matNome(m)}</b><div class="sub">${GU_NOME[m.guilda]||m.guilda}</div></div><div><div class="cot">${gcf(m.gc_por_g)}</div><div class="var ${cl}">${v>0?"▲":v<0?"▼":"■"} ${gcf(Math.abs(v))}%${a?" desde a última mudança":""}</div></div>${spark(m.serie)}
     <div class="ritmo"><span>Pesar a cada</span>${ed?`<div class="op">${[3,7].map(d=>`<button type="button" data-pesrit="${m.material}|${d}" aria-pressed="${+m.ritmo_dias===d}">${d} dias</button>`).join("")}</div>`:`<b>${m.ritmo_dias} dias</b>`}${+m.media_g?`<span>· média ${fmt(+m.media_g)} g por pesagem</span>`:""}</div></div>`}).join("")}
  ${ed?`<h3 class="h3">Mudar uma cotação</h3>

   <div class="campo"><label for="cMat">Material</label><select class="inp" id="cMat">${C.map(m=>`<option value="${m.material}" ${PES_CF.material===m.material?"selected":""}>${matNome(m)} · ${GU_NOME[m.guilda]||m.guilda}</option>`).join("")}</select></div>
   <div class="dois"><div class="campo"><label for="cVal">Nova cotação (GC por grama)</label><input class="inp" id="cVal" type="number" step="0.05" min="0.05" value="${PES_CF.val||cotDe(PES_CF.material).gc_por_g.toFixed(2)}"></div>
     <div class="campo"><label for="cDia">Vale a partir de</label><input class="inp" id="cDia" type="date" value="${PES_CF.desde}" min="${hojeISO()}"></div></div>
   <div class="campo"><label for="cMot">Motivo (vai para o histórico e para o aviso aos jogadores)</label><input class="inp" id="cMot" maxlength="120" value="${(PES_CF.mot||"").replace(/"/g,"&quot;")}" placeholder="Ex.: lote com mais grampos por caixa"></div>
   <div class="impacto" id="cImp">${impactoCot()}</div>
   <button class="btn ok larga" type="submit" ${PES_OCUP?"disabled":""}>${PES_OCUP?"Salvando…":"Salvar cotação"}</button></form>`:""}
  <h3 class="h3">Histórico de cotações</h3>
  <div class="caixa" style="overflow-x:auto"><table class="hist"><thead><tr><th>Desde</th><th>Material</th><th>Cotação</th>${(PES.historico||[]).some(h=>h.quem)?"<th>Quem</th>":""}<th>Motivo</th></tr></thead><tbody>${(PES.historico||[]).map(h=>`<tr><td>${dataCurta(h.desde)}</td><td>${matNome(cotDe(h.material))}</td><td>${h.de!=null&&h.de!==""?gcf(h.de)+" → ":""}${gcf(h.para)}</td>${(PES.historico||[]).some(h=>h.quem)?`<td>${h.quem||""}</td>`:""}<td>${h.motivo||""}</td></tr>`).join("")||`<tr><td colspan="5" class="sub">Nenhuma mudança ainda.</td></tr>`}</tbody></table></div>`}

function impactoCot(){const m=cotDe(PES_CF.material),nv=+(PES_CF.val||m.gc_por_g),pes=PES.recs.filter(r=>r.material===m.material).length||1,dif=Math.round((nv-m.gc_por_g)*(+m.media_g||0)*pes);

  PES_OCUP=true;telaLider();
  try{const x=await api("cotacao",{material:m.material,gc_por_g:nv,desde:PES_CF.desde,motivo:PES_CF.mot.trim()});toast(x.mensagem||"Cotação salva.");PES_CF=null;await carregarPes()}catch(e){toast(e.message)}finally{PES_OCUP=false;if(aba==="pesa")telaLider()}}

    const A1=mapa("#ff00fe"),A2=mapa("#00fe00"),px=[];for(const q in A1)if(A2[q]&&A2[q][2]!==A1[q][2])px.push(A1[q]);
    if(px.length>=2){const xs=px.map(p=>p[0]),ys=px.map(p=>p[1]);r={x:(Math.min(...xs)+Math.max(...xs))/2,y:(Math.min(...ys)+Math.max(...ys))/2}}}catch(e){}
